# Native Inspect Robots settings; CLI -P / -E override these values.
[defaults]
policy = agent
embodiment = fr3
max_steps = 300
store_frames = true

[policy.args]
wire = codex
model = gpt-5.5
effort = low
transcript_echo = true
prior_learnings = configs/learnings/fr3_cup_rim.md

[embodiment.args]
site_config = configs/site/fr3.yaml
